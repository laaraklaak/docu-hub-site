<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Registration | Docu-Hub Jamaica</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-light:   #EAECE9; /* Matches your new deeper homepage background */
            --brand-drk:  #1E2B1D; 
            --gold:       #C19A5B; 
            --gold-lt:    #DAB87F;
            --serif:      'Playfair Display', Georgia, serif; 
            --sans:       'Jost', Arial, sans-serif; 
        }
        
        body { font-family: var(--sans); background: var(--bg-light); margin: 0; padding: 0; color: #111; }
        
        /* Minimal Navbar just for the portal */
        .portal-nav { background: var(--brand-drk); padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo { font-family: var(--serif); font-size: 1.4rem; color: #fff; text-decoration: none; letter-spacing: 0.05em; }
        .nav-logo em { color: var(--gold-lt); font-style: normal; }
        .back-btn { font-family: var(--sans); font-size: 0.8rem; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 4px; transition: 0.3s; }
        .back-btn:hover { background: var(--gold); }

        /* Form Container */
        .form-wrapper { max-width: 800px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .portal-header { margin-bottom: 30px; }
        .portal-header h1 { font-family: var(--serif); font-size: 2.2rem; color: var(--brand-drk); margin-bottom: 8px; }
        .portal-header p { font-family: var(--sans); color: #4A4F48; font-size: 1rem; }
        
        .embed-container { background: #fff; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.09); overflow: hidden; padding-top: 10px; border: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Minimal Secure Navbar -->
    <nav class="portal-nav">
        <a href="index.html" class="nav-logo">Docu-Hub <em>Jamaica</em></a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Back to Home</a>
    </nav>

    <!-- Google Form Section -->
    <div class="form-wrapper">
        <div class="portal-header">
            <h1>Secure Client Registration</h1>
            <p>Please select your location below to route your request to the correct agent.</p>
        </div>
        
        <div class="embed-container">
            <!-- YOUR EMBEDDED GOOGLE FORM -->
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSeeZdgthrriuwiMPUiNhu5eQnAWjxEtM-Ti6sMXqvZ_U6NHkw/viewform?embedded=true" 
                width="100%" 
                height="1100" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
                Loading…
            </iframe>
        </div>
    </div>

</body>
</html>
